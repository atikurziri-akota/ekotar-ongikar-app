
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>একতার অঙ্গীকার</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #172b4d;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px 24px;
      border-radius: 20px;
      box-shadow: 0 8px 30px #172b4d18;
    }
    .logo {
      width: 65px;
      height: 65px;
      margin: auto;
      border-radius: 18px;
      background: #087f5b;
      color: white;
      display: grid;
      place-items: center;
      font-size: 30px;
    }
    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 8px;
      color: #087f5b;
    }
    .sub {
      text-align: center;
      color: #718096;
      font-size: 14px;
      margin-bottom: 28px;
    }
    label {
      display: block;
      font-size: 14px;
      margin: 16px 0 7px;
    }
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d6deea;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }
    input:focus { border-color: #087f5b; }
    button {
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #087f5b;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }
    .note {
      text-align: center;
      color: #718096;
      font-size: 12px;
      margin-top: 22px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">🤝</div>
    <h1>একতার অঙ্গীকার</h1>
    <p class="sub">৫০ জনের এক পরিবার</p>

    <form id="loginForm">
      <label for="email">ইমেইল ঠিকানা</label>
      <input id="email" type="email"
        placeholder="আপনার ইমেইল লিখুন" required>

      <label for="password">পাসওয়ার্ড</label>
      <input id="password" type="password"
        placeholder="আপনার পাসওয়ার্ড লিখুন" required>

      <button type="submit">লগইন করুন</button>
    </form>

    <p class="note">
      সদস্য ও অ্যাডমিনের নিরাপদ প্রবেশদ্বার<br>
      © একতার অঙ্গীকার
    </p>
  </main>

  <script>
    document.getElementById("loginForm")
      .addEventListener("submit", function(event) {
        event.preventDefault();
        alert("Supabase Login পরবর্তী ধাপে সংযুক্ত করা হবে।");
      });
  </script>
</body>
</html>
