
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>একতার অঙ্গীকার</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #172b4d;
      min-height: 100vh;
    }
    .card, #adminDashboard {
      width: 100%;
      max-width: 600px;
      margin: 30px auto;
      padding: 25px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 30px #172b4d18;
    }
    .login-card { max-width: 420px; }
    .logo {
      width: 65px;
      height: 65px;
      margin: auto;
      border-radius: 18px;
      background: #087f5b;
      color: white;
      display: grid;
      place-items: center;
      font-size: 30px;
    }
    h1, .sub { text-align: center; }
    h1 { color: #087f5b; font-size: 24px; }
    .sub { color: #718096; margin-bottom: 25px; }
    label {
      display: block;
      margin: 16px 0 7px;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d6deea;
      border-radius: 10px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #087f5b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    #message, #memberMessage {
      text-align: center;
      overflow-wrap: anywhere;
    }
    .stat {
      padding: 12px;
      margin: 10px 0;
      background: #f3f6fb;
      border-radius: 10px;
    }
    hr { margin: 25px 0; border: 0; border-top: 1px solid #ddd; }
    #logoutButton { background: #b42318; }
  </style>
</head>
<body>

  <main class="card login-card">
    <div class="logo">🤝</div>
    <h1>একতার অঙ্গীকার</h1>
    <p class="sub">৫০ জনের এক পরিবার</p>

    <form id="loginForm">
      <label for="email">ইমেইল ঠিকানা</label>
      <input id="email" type="email" required
        placeholder="আপনার ইমেইল লিখুন">

      <label for="password">পাসওয়ার্ড</label>
      <input id="password" type="password" required
        placeholder="আপনার পাসওয়ার্ড লিখুন">

      <button id="loginButton" type="submit">লগইন করুন</button>
    </form>
    <p id="message" role="status"></p>
    <p class="sub">সদস্য ও অ্যাডমিনের প্রবেশদ্বার</p>
  </main>

  <main id="adminDashboard" style="display:none;">
    <h2>অ্যাডমিন ড্যাশবোর্ড</h2>
    <p>একতার অঙ্গীকার — ৫০ জনের এক পরিবার</p>

    <div id="dashboardData">
      <div class="stat">মোট সদস্য: <span id="totalMembers">লোড হচ্ছে...</span></div>
      <div class="stat">মোট জমা: ৳<span id="totalDeposits">লোড হচ্ছে...</span></div>
      <div class="stat">মোট জরিমানা: ৳<span id="totalFines">লোড হচ্ছে...</span></div>
      <div class="stat">মোট খরচ: ৳<span id="totalExpenses">লোড হচ্ছে...</span></div>
    </div>

    <hr>
    <h3>নতুন সদস্য যোগ করুন</h3>

    <form id="memberForm">
      <label for="memberNo">সদস্য নম্বর</label>
      <input type="number" id="memberNo" min="1" required>

      <label for="memberName">সদস্যের নাম</label>
      <input type="text" id="memberName" required>

      <label for="memberPhone">মোবাইল নম্বর</label>
      <input type="tel" id="memberPhone">
<label for="memberShare">শেয়ার সংখ্যা</label>
<input type="number" id="memberShare" min="1" value="1" required>

<label for="memberNominee">নমিনির নাম</label>
<input type="text" id="memberNominee" placeholder="নমিনির পূর্ণ নাম">
      <button id="memberButton" type="submit">সদস্য যোগ করুন</button>
    </form>

    <p id="memberMessage" role="status"></p>
    <hr>
<h3>সদস্য তালিকা</h3>
<button id="loadMembersButton" type="button">সদস্য তালিকা দেখুন</button>
<div id="memberList">এখনো তালিকা লোড হয়নি।</div>
    <button id="logoutButton" type="button">লগআউট</button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    
    const SUPABASE_URL = "https://xlzpwrzejqvpdndkzloj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_hPFsJ4F-jfJM4H5xRNK3Kg_jLSQDzIf";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");
    const memberForm = document.getElementById("memberForm");
    const memberButton = document.getElementById("memberButton");
    const memberMessage = document.getElementById("memberMessage");

    async function loadDashboard() {
      const { data: stats, error } = await supabaseClient
        .from("admin_dashboard")
        .select("*")
        .single();

      if (error) {
        document.getElementById("dashboardData").textContent =
          "তথ্য লোড হয়নি: " + error.message;
        return;
      }

      document.getElementById("totalMembers").textContent =
        stats.total_members ?? 0;
      document.getElementById("totalDeposits").textContent =
        stats.total_deposits ?? 0;
      document.getElementById("totalFines").textContent =
        stats.total_fines ?? 0;
      document.getElementById("totalExpenses").textContent =
        stats.total_expenses ?? 0;
    }

    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();
      loginButton.disabled = true;
      loginButton.textContent = "অপেক্ষা করুন...";
      message.textContent = "";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const { data, error } = await supabaseClient.auth
          .signInWithPassword({ email, password });

        if (error) throw error;

        const { data: roleData, error: roleError } = await supabaseClient
          .from("user_roles")
          .select("role")
          .eq("user_id", data.user.id)
          .single();

        if (roleError || roleData?.role !== "admin") {
          await supabaseClient.auth.signOut();
          throw new Error("অ্যাডমিন অনুমতি পাওয়া যায়নি।");
        }

        document.querySelector(".login-card").style.display = "none";
        document.getElementById("adminDashboard").style.display = "block";
        await loadDashboard();

      } catch (err) {
        message.style.color = "#d62828";
        message.textContent = "লগইন হয়নি: " + err.message;
      }

      loginButton.disabled = false;
      loginButton.textContent = "লগইন করুন";
    });

    memberForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      memberButton.disabled = true;
      memberButton.textContent = "যোগ হচ্ছে...";
      memberMessage.textContent = "";

 const memberNo = Number(document.getElementById("memberNo").value);
const memberName = document.getElementById("memberName").value.trim();
const memberPhone = document.getElementById("memberPhone").value.trim();
const memberShare = Number(document.getElementById("memberShare").value);
const memberNominee = document.getElementById("memberNominee").value.trim();

try {
  const { error } = await supabaseClient
    .from("members")
    .insert([{
      member_no: memberNo,
      full_name: memberName,
      phone: memberPhone || null,
      monthly_share: memberShare,
      nominee_name: memberNominee || null
    }]);

        if (error) throw error;

        memberMessage.style.color = "#087f5b";
        memberMessage.textContent = "সদস্য সফলভাবে যোগ হয়েছে।";
        memberForm.reset();
        await loadDashboard();

      } catch (err) {
        memberMessage.style.color = "#d62828";
        memberMessage.textContent = "সদস্য যোগ হয়নি: " + err.message;
      }

      memberButton.disabled = false;
      memberButton.textContent = "সদস্য যোগ করুন";
    });

    document.getElementById("logoutButton")
      .addEventListener("click", async function() {
        await supabaseClient.auth.signOut();
        location.reload();
      });
    document.getElementById("loadMembersButton")
  .addEventListener("click", async function() {
    const list = document.getElementById("memberList");
    list.textContent = "সদস্য তালিকা লোড হচ্ছে...";

    const { data, error } = await supabaseClient
      .from("members")
      .select("member_no, full_name, phone, status")
      .order("member_no", { ascending: true });

    if (error) {
      list.textContent = "তালিকা লোড হয়নি: " + error.message;
      return;
    }

    if (!data || data.length === 0) {
      list.textContent = "কোনো সদস্য পাওয়া যায়নি।";
      return;
    }

    list.innerHTML = "";

    data.forEach(function(member) {
      const item = document.createElement("p");
      item.textContent =
        "নম্বর: " + member.member_no +
        " | নাম: " + member.full_name +
        " | মোবাইল: " + (member.phone || "নেই") +
        " | অবস্থা: " + member.status;
      list.appendChild(item);

      const editButton = document.createElement("button");
      editButton.textContent = "Edit";
      editButton.style.marginTop = "5px";

      editButton.addEventListener("click", async function() {
        const newName = prompt("সদস্যের নতুন নাম লিখুন:", member.full_name);
        if (newName === null || !newName.trim()) return;

        const newPhone = prompt("নতুন মোবাইল নম্বর লিখুন:", member.phone || "");
        if (newPhone === null) return;

        const { error: updateError } = await supabaseClient
          .from("members")
          .update({
            full_name: newName.trim(),
            phone: newPhone.trim() || null
          })
          .eq("member_no", member.member_no);

        if (updateError) {
          alert("সংশোধন হয়নি: " + updateError.message);
        } else {
          alert("সদস্যের তথ্য সংশোধন হয়েছে।");
          document.getElementById("loadMembersButton").click();
        }
      });

      list.appendChild(editButton);
      const deleteButton = document.createElement("button");
deleteButton.textContent = "Delete";
deleteButton.style.background = "#b42318";
deleteButton.style.marginTop = "5px";

deleteButton.addEventListener("click", async function() {
  const confirmDelete = confirm(
    "আপনি কি নিশ্চিত এই সদস্যকে মুছে ফেলতে চান?"
  );

  if (!confirmDelete) return;

  const { error: deleteError } = await supabaseClient
    .from("members")
    .delete()
    .eq("member_no", member.member_no);

  if (deleteError) {
    alert("মুছে ফেলা যায়নি: " + deleteError.message);
  } else {
    alert("সদস্য মুছে ফেলা হয়েছে।");
    document.getElementById("loadMembersButton").click();
  }
});

list.appendChild(deleteButton);
    });
  });
  </script>
</body>
</html>
