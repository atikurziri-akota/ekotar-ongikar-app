
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>একতার অঙ্গীকার</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #172b4d;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px 24px;
      border-radius: 20px;
      box-shadow: 0 8px 30px #172b4d18;
    }

    .logo {
      width: 65px;
      height: 65px;
      margin: auto;
      border-radius: 18px;
      background: #087f5b;
      color: white;
      display: grid;
      place-items: center;
      font-size: 30px;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      color: #087f5b;
    }

    .sub {
      text-align: center;
      color: #718096;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 14px;
      margin: 16px 0 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d6deea;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #087f5b;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      text-align: center;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .note {
      text-align: center;
      color: #718096;
      font-size: 12px;
      margin-top: 22px;
    }

    #adminDashboard {
      width: 100%;
      max-width: 600px;
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 8px 30px #172b4d18;
    }
  </style>
</head>

<body>

  <main class="card">
    <div class="logo">🤝</div>
    <h1>একতার অঙ্গীকার</h1>
    <p class="sub">৫০ জনের এক পরিবার</p>

    <form id="loginForm">
      <label for="email">ইমেইল ঠিকানা</label>
      <input id="email" type="email"
        placeholder="আপনার ইমেইল লিখুন" required>

      <label for="password">পাসওয়ার্ড</label>
      <input id="password" type="password"
        placeholder="আপনার পাসওয়ার্ড লিখুন" required>

      <button id="loginButton" type="submit">
        লগইন করুন
      </button>
    </form>

    <p id="message" role="status"></p>

    <p class="note">
      সদস্য ও অ্যাডমিনের প্রবেশদ্বার<br>
      © একতার অঙ্গীকার
    </p>
  </main>

  <div id="adminDashboard" style="display:none;">
    <h2>অ্যাডমিন ড্যাশবোর্ড</h2>
    <p>একতার অঙ্গীকার — ৫০ জনের এক পরিবার</p>
    <div id="dashboardData">
  <p>মোট সদস্য: <span id="totalMembers">লোড হচ্ছে...</span></p>
  <p>মোট জমা: ৳<span id="totalDeposits">লোড হচ্ছে...</span></p>
  <p>মোট জরিমানা: ৳<span id="totalFines">লোড হচ্ছে...</span></p>
  <p>মোট খরচ: ৳<span id="totalExpenses">লোড হচ্ছে...</span></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://xlzpwrzejqvpdndkzloj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_hPFsJ4F-jfJM4H5xRNK3Kg_jLSQDzIf";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      button.disabled = true;
      button.textContent = "অপেক্ষা করুন...";
      message.textContent = "";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email,
            password
          });

        if (error) {
          message.style.color = "#d62828";
          message.textContent = "লগইন হয়নি: " + error.message;

        } else {
          const { data: roleData, error: roleError } =
            await supabaseClient
              .from("user_roles")
              .select("role")
              .eq("user_id", data.user.id)
              .single();

          if (!roleError && roleData?.role === "admin") {
            document.querySelector(".card").style.display = "none";
            document.getElementById("adminDashboard").style.display = "block";
const { data: stats, error: statsError } =
  await supabaseClient
    .from("admin_dashboard")
    .select("*")
    .single();

if (statsError) {
  document.getElementById("dashboardData").textContent =
    "তথ্য লোড হয়নি: " + statsError.message;
} else {
  document.getElementById("totalMembers").textContent = stats.total_members ?? 0;
  document.getElementById("totalDeposits").textContent = stats.total_deposits ?? 0;
  document.getElementById("totalFines").textContent = stats.total_fines ?? 0;
  document.getElementById("totalExpenses").textContent = stats.total_expenses ?? 0;
}
          } else {
            message.style.color = "#d62828";
            message.textContent = "অ্যাডমিন অনুমতি পাওয়া যায়নি।";
          }
        }

      } catch (err) {
        message.style.color = "#d62828";
        message.textContent = "সমস্যা হয়েছে: " + err.message;
      }

      button.disabled = false;
      button.textContent = "লগইন করুন";
    });
  </script>

</body>
</html>
